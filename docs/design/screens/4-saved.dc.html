</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"cover":{"editor":"color","default":"#9E2F2A","options":["#9E2F2A","#2F5D50","#E0704A","#34323A"],"section":"สมุด"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const cover = this.props.cover ?? '#9E2F2A';
    const mix = (hex, t) => { const a = parseInt(hex.slice(1), 16), b = 0x2D2B33; const c = [16, 8, 0].map((s) => Math.round(((a >> s) & 255) * (1 - t) + ((b >> s) & 255) * t)); return 'rgb(' + c.join(',') + ')'; };
    const book = { cover: cover, spine: mix(cover, 0.14), strap: mix(cover, 0.32) };
    return Object.assign({}, book);
  }
}
</script>
